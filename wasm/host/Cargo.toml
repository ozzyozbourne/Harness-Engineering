[package]
name = "cmh-wasm"
version = "0.1.0"
edition = "2024"
description = "cmh: a continual, self-modifying coding-agent harness that runs entirely inside a WebAssembly component (WASM flavor)"
license = "MIT"
publish = false
build = "build.rs"

[[bin]]
name = "cmh"
path = "src/main.rs"

[lib]
name = "cmh"
path = "src/lib.rs"

[dependencies]
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
wasmtime = { version = "50", default-features = false, features = ["cranelift", "runtime", "std", "component-model"] }
wasmtime-wasi = { version = "50", default-features = false, features = ["p2"] }
