[package]
name = "cmh-guest"
version = "0.1.0"
edition = "2024"
description = "cmh WASM flavor: the guest kernel (agent loop, gate, Forth userspace), a wasm32-wasip2 component"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
serde_json = "1"
wit-bindgen = { version = "0.63", default-features = false, features = ["macros", "realloc"] }

# Standalone workspace: built only for wasm32-wasip2 (host/build.rs, and the
# hypervisor's image builds).
[workspace]

[profile.release]
opt-level = 2
panic = "abort"
codegen-units = 16
debug = false
strip = true
incremental = false
